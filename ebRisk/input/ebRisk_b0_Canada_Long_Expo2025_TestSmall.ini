[general]
description = TEST 2026 ebRisk-Stochastic ebRisk model for Canada; baseline: only 40,000 year eff catalogue. Storing parquets for insurance module. Changed minimum mags, to focus on damaging events. Updated 2025 exposure. Modified ebRisk to export interim files as parquet in a directory in CanadaSRM-output/ebRisk called 'parquet-out'.
calculation_mode = ebrisk

[exposure]
exposure_file = ../../../CanadaSRM-input/current/exposure/oqBldgExp_CA_2025Update.xml

[sites]
site_model_file = ../../../CanadaSRM-input/current/geotech/site-vgrid_CA.csv

[erf]
width_of_mfd_bin = 0.2
rupture_mesh_spacing = 5.0
area_source_discretization = 10.0
complex_fault_mesh_spacing = 10.0

[logic_trees]
source_model_logic_tree_file = ../../../CanadaSRM-input/current/hazard/sources/logicTree/nationalModel.xml
gsim_logic_tree_file = ../../../CanadaSRM-input/current/hazard/gmms/LogicTree/OQ_classes_NGASa0p3weights.xml
number_of_logic_tree_samples = 10
ses_per_logic_tree_path = 4000

[hazard_calculation]
ses_seed = 23
random_seed = 24
truncation_level = 3
investigation_time = 1
asset_hazard_distance = 100

minimum_intensity = {"SA(0.3)": 0.02, "SA(0.6)": 0.05, "SA(1.0)": 0.05, "SA(2.0)": 0.05}
minimum_magnitude = {"default": 5.0, 
                     "Stable Shallow Crust": 5.0,
                     "Active Shallow Crust": 5.0,
                     "Subduction Interface": 6.0,
                     "Subduction IntraSlab30": 6.0,
                     "Subduction IntraSlab55": 6.0}

maximum_distance = {"Active Shallow Crust": 400.0, "Stable Shallow Crust": 600.0, "Subduction IntraSlab30": 400, "Subduction IntraSlab55": 400, "Subduction Interface": 1000.0}
                    

[vulnerability]
taxonomy_mapping_csv = ../../../CanadaSRM-input/current/vulnerability/CanSRM1_TaxMap_b0.csv
structural_vulnerability_file = ../../../CanadaSRM-input/current/vulnerability/vulnerability_structural_CAN.xml
nonstructural_vulnerability_file = ../../../CanadaSRM-input/current/vulnerability/vulnerability_nonstructural_CAN.xml
contents_vulnerability_file = ../../../CanadaSRM-input/current/vulnerability/vulnerability_contents_CAN.xml
occupants_vulnerability_file = ../../../CanadaSRM-input/current/vulnerability/vulnerability_occupants_CAN.xml

[risk_calculation]
master_seed = 25
avg_losses = false
#return_periods = 1000
minimum_asset_loss = 5000
#minimum_asset_loss = {"structural": 5000, "nonstructural": 5000, "contents": 1000}
time_event = day
risk_investigation_time = 1
#quantiles = 0.05, 0.95
#aggregate_by = ss_region
